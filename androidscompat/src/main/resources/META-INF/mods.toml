[[mods]]
modId="androidscompat"
version="${file.jarVersion}"
displayName="CC:Androids Compatibility"
authors="Puentenorte"
description='''
Adds server-side compatibility between CC:Androids and NTGL weapons.
Androids acquire hostile targets while holding an NTGL weapon, allowing NTGL
to handle ranged attacks, ammunition and reloading. Androids mounted in
Immersive Aircraft vehicles can pilot, bomb ground enemies and fire at other
aircraft.
'''

